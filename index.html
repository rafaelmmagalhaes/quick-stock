2,8.5,'D1 · 01','Würth'],['Bucha nylon 8 mm','Fixação','cx',22,20,10,6.2,'D1 · 02','Würth'],['Silicone neutro 300 ml','Fixação','un',55,55,20,4.8,'D2 · 01','Soudal'],['Espuma poliuretano 750 ml','Isolamento','un',9,12,15,7.9,'D2 · 02','Soudal'],['Tubo PVC 50 mm · 3 m','Canalização','un',36,36,10,5.7,'E1 · 01','Fersil'],['Joelho PVC 50 mm','Canalização','un',74,74,20,1.2,'E1 · 02','Fersil'],['Cabo elétrico 3G2,5 mm²','Eletricidade','m',420,450,100,1.8,'E2 · 01','Nexans'],['Tomada schuko branca','Eletricidade','un',32,32,10,4.6,'E2 · 02','Efapel'],['Pavimento vinílico carvalho','Acabamentos','m²',86,90,25,22,'F1 · 01','Tarkett'],['Rodapé MDF branco 80 mm','Acabamentos','m',125,125,30,3.9,'F1 · 02','Tarkett'],['Azulejo branco 30 × 60 cm','Acabamentos','m²',14,14,20,16.5,'F2 · 01','Revigrés']];
const KEY='quick-sketches-stock-clean-v3';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString('pt-PT',{style:'currency',currency:'EUR'}), num=n=>Number(n).toLocaleString('pt-PT',{maximumFractionDigits:2});
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Lisbon',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function offset(d,n){let a=new Date(d+'T12:00:00Z');a.setUTCDate(a.getUTCDate()+n);return a.toISOString().slice(0,10)}
function initial(){return {products:Array.from({length:5},(_,i)=>({id:i+1,ref:'QS-'+String(i+1).padStart(3,'0'),name:'Produto '+(i+1),cat:'',unit:'un',stock:0,min:0,price:0,loc:'Geral',supplier:''})),moves:[],counts:[]}}
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.products)||!Array.isArray(db.moves))db=initial();
let page='products',q='',cat='',status='',filters={period:'month',from:offset(today(),-29),to:today(),type:'',product:'',place:'',query:''};let countDraft={};let storageFailed=false;
const names={products:'Produtos',moves:'Movimentos',inventory:'Inventário',reports:'Relatórios'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageFailed=false}catch{storageFailed=true;toast('Não foi possível guardar no navegador. Exporte uma cópia de segurança.')}render()}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',4000)}
function go(p){page=p;render();window.scrollTo(0,0)}
function modal(title,body,footer=''){let m=document.getElementById('modal');m.innerHTML=`<div class="modalhead"><h2>${title}</h2><button class="btn small" aria-label="Fechar" onclick="closeModal()">✕</button></div><div class="modalbody">${body}</div>${footer?`<div class="modalfoot">${footer}</div>`:''}`;m.showModal()}
function closeModal(){document.getElementById('modal').close()}
function stockLevel(p){return p.stock<p.min?'low':p.stock<=p.min*2?'medium':'high'}
function stockBadge(p){let level=stockLevel(p);return `<span class="pill ${level==='low'?'red':level==='medium'?'amber':''}">${level==='low'?'Stock baixo':level==='medium'?'Atenção':'Disponível'}</span>`}
function productsFiltered(){return db.products.filter(p=>(!q||(p.name+' '+p.ref+' '+p.supplier+' '+p.loc).toLowerCase().includes(q.toLowerCase()))&&(!cat||p.cat===cat)&&(!status||stockLevel(p)===status))}
function metrics(){return `<div class="metrics"><div class="metric"><span class="icon">▤</span><div class="label">Produtos registados</div><div class="number">${db.products.length}</div><small>Um único saldo por produto</small></div><div class="metric"><span class="icon">€</span><div class="label">Valor em stock</div><div class="number">${money(db.products.reduce((s,p)=>s+p.stock*p.price,0))}</div><small>Stock atual × custo unitário</small></div><div class="metric warn"><span class="icon">!</span><div class="label">Abaixo do mínimo</div><div class="number">${db.products.filter(p=>p.stock<p.min).length}</div><small>Produtos a repor</small></div><div class="metric"><span class="icon">⇄</span><div class="label">Movimentos de hoje</div><div class="number">${db.moves.filter(m=>m.date===today()).length}</div><small>Entradas, saídas e ajustes</small></div></div>`}
function productRows(){let a=productsFiltered();return a.map(p=>`<tr class="product-row" tabindex="0" aria-label="Editar ${esc(p.name)}" onclick="productModal(${p.id})" onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();productModal(${p.id})}"><td><div class="item"><span class="producticon">▧</span><div><strong>${esc(p.name)}</strong><small>${esc(p.ref)} · ${esc(p.supplier)}</small></div></div></td><td>${esc(p.cat)}</td><td class="qty"><span class="stock-number ${stockLevel(p)}">${num(p.stock)} <span class="unit">${esc(p.unit)}</span></span></td><td>${num(p.min)} ${esc(p.unit)}</td><td>${money(p.price)}</td><td>${esc(p.loc)}</td><td>${stockBadge(p)}</td><td><button class="btn small" onclick="event.stopPropagation();productModal(${p.id})">Editar</button> <button class="btn small" aria-label="Registar movimento de ${esc(p.name)}" onclick="event.stopPropagation();moveModal(${p.id})">⇄</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhum produto corresponde aos filtros.</td></tr>'}
function productView(){return metrics()+`<div class="panel"><div class="panelhead"><div><h2>Todos os produtos</h2><p style="font-size:12px">Quantidades, localização e reposição num só lugar.</p></div><button class="btn small" onclick="exportProducts()">↓ Exportar stock</button></div><div class="tools"><div class="search"><input aria-label="Pesquisar produtos" value="${esc(q)}" placeholder="Pesquisar nome, referência, fornecedor ou localização…" oninput="q=this.value;updateProducts()"></div><select aria-label="Categoria" onchange="cat=this.value;updateProducts()"><option value="">Todas as categorias</option>${[...new Set(db.products.map(p=>p.cat))].sort().map(c=>`<option ${cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select aria-label="Estado do stock" onchange="status=this.value;updateProducts()"><option value="">Todos os estados</option><option value="low" ${status==='low'?'selected':''}>Stock baixo</option><option value="medium" ${status==='medium'?'selected':''}>Atenção · amarelo</option><option value="high" ${status==='high'?'selected':''}>Disponível · verde</option></select></div><div class="tablewrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Stock atual</th><th>Mínimo</th><th>Custo / un.</th><th>Localização</th><th>Estado</th><th>Ações</th></tr></thead><tbody id="productrows">${productRows()}</tbody></table></div><div class="tablefoot"><span id="productcount">${productsFiltered().length} produtos</span><span>Clique no produto para editar · Vermelho: abaixo do mínimo · Amarelo: mínimo até 2× · Verde: acima de 2×</span></div></div>`}
function updateProducts(){document.getElementById('productrows').innerHTML=productRows();document.getElementById('productcount').textContent=productsFiltered().length+' produtos'}
function productModal(id){let p=db.products.find(p=>p.id===id);modal(p?'Editar produto':'Adicionar produto',`<form id="productform"><div class="field"><label for="pname">Nome do produto *</label><input id="pname" required maxlength="120" value="${esc(p?.name||'')}"></div><div class="fields">${field('pref','Referência *',p?.ref||'QS-'+String(Math.max(0,...db.products.map(p=>p.id))+1).padStart(3,'0'),'text','required maxlength="40"')}${field('pcat','Categoria',p?.cat||'','text','maxlength="60"')}</div><div class="fields"><div class="field"><label for="punit">Unidade</label><select id="punit">${['un','m','m²','kg','L','saco','cx'].map(u=>`<option ${p?.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>${field('pmin','Stock mínimo',p?.min??0,'number','min="0" step="0.01" required')}</div><div class="fields">${field('pprice','Custo unitário (€)',p?.price??0,'number','min="0" step="0.01" required')}${p?'':field('pstock','Stock inicial',0,'number','min="0" step="0.01" required')}</div><div class="fields">${field('ploc','Localização',p?.loc||'','text','maxlength="80"')}${field('psupplier','Fornecedor',p?.supplier||'','text','maxlength="80"')}</div><p style="font-size:12px">${p?'Altere quantidades através de um movimento ou de uma contagem de inventário.':'O stock inicial fica registado no histórico.'}</p><p id="error" role="alert" style="color:#b65f47"></p></form>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveProduct(${id||0})">Guardar produto</button>`)}
function field(id,label,value,type='text',attrs=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${attrs}></div>`}const val=id=>document.getElementById(id).value;
function saveProduct(id){if(!document.getElementById('productform').reportValidity())return;let p=db.products.find(p=>p.id===id),ref=val('pref').trim(),name=val('pname').trim(),category=val('pcat').trim();if(!ref||!name){document.getElementById('error').textContent='Preencha nome e referência.';return}if(db.products.some(p=>p.id!==id&&p.ref.toLowerCase()===ref.toLowerCase())){document.getElementById('error').textContent='Já existe um produto com esta referência.';return}let unit=val('punit');if(p&&unit!==p.unit&&db.moves.some(m=>m.product===id)){document.getElementById('error').textContent='A unidade tem movimentos associados e não pode ser alterada.';return}let data={ref,name,cat:category,unit,min:+val('pmin'),price:+val('pprice'),loc:val('ploc').trim(),supplier:val('psupplier').trim()};if(p)Object.assign(p,data);else{p={...data,id:Math.max(0,...db.products.map(p=>p.id))+1,stock:0};db.products.push(p);record(p,+val('pstock'),'Stock inicial',{place:p.loc,note:'Criação de produto',document:''})}closeModal();save();toast('Produto guardado.')}
function record(p,delta,type,extra={}){let before=p.stock;p.stock=+(p.stock+delta).toFixed(2);let m={id:Math.max(0,...db.moves.map(m=>m.id))+1,date:today(),time:new Intl.DateTimeFormat('pt-PT',{timeZone:'Europe/Lisbon',hour:'2-digit',minute:'2-digit'}).format(new Date()),product:p.id,name:p.name,ref:p.ref,unit:p.unit,type,delta,quantity:Math.abs(delta),price:p.price,before,after:p.stock,...extra};db.moves.push(m);return m}
function moveModal(id){modal('Registar entrada ou saída',`<form id="moveform"><div class="field"><label for="mproduct">Produto</label><select id="mproduct" required>${db.products.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${esc(p.name)} · ${num(p.stock)} ${esc(p.unit)}</option>`).join('')}</select></div><div class="fields"><div class="field"><label for="mtype">Tipo</label><select id="mtype"><option>Entrada</option><option>Saída</option><option>Devolução</option></select></div>${field('mqty','Quantidade *',1,'number','min="0.01" step="0.01" required')}</div><div class="fields">${field('mdate','Data *',today(),'date','required max="'+today()+'"')}${field('mplace','Origem / destino *','','text','required maxlength="120"')}</div>${field('mdoc','Documento / referência (opcional)','','text','maxlength="80"')}${field('mnote','Observações (opcional)','','text','maxlength="200"')}<p id="error" role="alert" style="color:#b65f47"></p></form>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveMove()">Guardar movimento</button>`)}
function saveMove(){if(!document.getElementById('moveform').reportValidity())return;let p=db.products.find(p=>p.id===+val('mproduct')),quantity=+val('mqty'),type=val('mtype'),delta=type==='Saída'?-quantity:quantity;if(!p||!Number.isFinite(quantity)||quantity<=0||p.stock+delta<0){document.getElementById('error').textContent='Quantidade inválida ou superior ao stock disponível.';return}if(!val('mplace').trim()){document.getElementById('error').textContent='Indique a origem ou o destino.';return}record(p,delta,type,{date:val('mdate'),place:val('mplace').trim(),document:val('mdoc').trim(),note:val('mnote').trim()});closeModal();save();toast('Movimento registado e stock atualizado.')}
function period(v){filters.period=v;let d=today();if(v==='today')filters.from=filters.to=d;else if(v==='week'){filters.from=offset(d,-6);filters.to=d}else if(v==='month'){filters.from=offset(d,-29);filters.to=d}else if(v==='previous'){let first=d.slice(0,7)+'-01',last=offset(first,-1);filters.from=last.slice(0,7)+'-01';filters.to=last}else if(v==='all'){filters.from='';filters.to=''}render()}
function filterToolbar(){return `<div class="panel" style="margin-bottom:20px"><div class="panelhead"><h2>Filtros do período</h2><span class="pill">Atualização automática</span></div><div class="tools" style="flex-wrap:wrap"><select aria-label="Período" onchange="period(this.value)">${[['today','Hoje'],['week','Últimos 7 dias'],['month','Últimos 30 dias'],['previous','Mês anterior'],['all','Todo o histórico'],['custom','Datas à escolha']].map(([v,t])=>`<option value="${v}" ${filters.period===v?'selected':''}>${t}</option>`).join('')}</select><input aria-label="Data inicial" type="date" value="${filters.from}" onchange="filters.from=this.value;filters.period='custom';render()"><input aria-label="Data final" type="date" value="${filters.to}" onchange="filters.to=this.value;filters.period='custom';render()"><select aria-label="Tipo de movimento" onchange="filters.type=this.value;refreshReport()"><option value="">Todos os tipos</option>${['Entrada','Saída','Devolução','Ajuste de inventário','Stock inicial'].map(t=>`<option ${filters.type===t?'selected':''}>${t}</option>`).join('')}</select><select aria-label="Produto" onchange="filters.product=this.value;refreshReport()"><option value="">Todos os produtos</option>${db.products.map(p=>`<option value="${p.id}" ${filters.product==p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input aria-label="Pesquisar origem ou destino" placeholder="Origem / destino" value="${esc(filters.place)}" oninput="filters.place=this.value;refreshReport()"><input aria-label="Pesquisar movimentos" placeholder="Produto, documento ou nota…" value="${esc(filters.query)}" oninput="filters.query=this.value;refreshReport()"><button class="btn small" onclick="filters={period:'all',from:'',to:'',type:'',product:'',place:'',query:''};render()">Limpar filtros</button></div></div>`}
function filteredMoves(){if(filters.from&&filters.to&&filters.from>filters.to)return [];return [...db.moves].filter(m=>(!filters.from||m.date>=filters.from)&&(!filters.to||m.date<=filters.to)&&(!filters.type||m.type===filters.type)&&(!filters.product||m.product==filters.product)&&(!filters.place||m.place.toLowerCase().includes(filters.place.toLowerCase()))&&(!filters.query||(m.name+' '+m.ref+' '+m.document+' '+m.note).toLowerCase().includes(filters.query.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)}
function movementTable(a){return `<div class="tablewrap"><table><thead><tr><th>Data / hora</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Stock antes → depois</th><th>Origem / destino</th><th>Documento / nota</th></tr></thead><tbody>${a.map(m=>`<tr><td>${m.date.split('-').reverse().join('/')}<small style="display:block;color:#93a184;margin-top:5px">${m.time}</small></td><td><b>${esc(m.name)}</b><small style="display:block;margin-top:5px;color:#94a080">${esc(m.ref)}</small></td><td><span class="pill ${m.delta<0?'amber':''}">${esc(m.type)}</span></td><td class="qty">${m.delta>0?'+':''}${num(m.delta)} <span class="unit">${esc(m.unit)}</span></td><td>${num(m.before)} → ${num(m.after)}</td><td>${esc(m.place)}</td><td>${esc(m.document)||'—'}<small style="display:block;color:#8d9b7e;max-width:180px;white-space:normal;margin-top:5px">${esc(m.note)}</small></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sem movimentos para estes filtros.</td></tr>'}</tbody></table></div>`}
function reportBody(){let a=filteredMoves(),invalid=filters.from&&filters.to&&filters.from>filters.to;let incoming=a.filter(m=>m.delta>0),outgoing=a.filter(m=>m.delta<0);let html=invalid?'<div class="notice">A data inicial deve ser anterior ou igual à data final.</div>':'';if(page==='reports'){html+=`<div class="metrics"><div class="metric"><div class="label">Movimentos no período</div><div class="number">${a.length}</div><small>${new Set(a.map(m=>m.product)).size} produtos movimentados</small></div><div class="metric"><div class="label">Entradas valorizadas</div><div class="number">${money(incoming.reduce((s,m)=>s+m.delta*m.price,0))}</div><small>${incoming.length} movimentos positivos</small></div><div class="metric"><div class="label">Saídas valorizadas</div><div class="number">${money(outgoing.reduce((s,m)=>s-m.delta*m.price,0))}</div><small>${outgoing.length} movimentos negativos</small></div><div class="metric"><div class="label">Variação valorizada</div><div class="number">${money(a.reduce((s,m)=>s+m.delta*m.price,0))}</div><small>Inclui ajustes e stock inicial filtrados</small></div></div><div class="panel" style="margin-bottom:22px"><div class="panelhead"><h2>Resumo por produto</h2><span style="font-size:11px;color:#8c997d">Quantidades mantidas na unidade de cada produto</span></div><div class="tablewrap"><table><thead><tr><th>Produto</th><th>Entradas</th><th>Saídas</th><th>Variação</th><th>Valor da variação</th></tr></thead><tbody>${[...new Set(a.map(m=>m.product))].map(id=>{let ms=a.filter(m=>m.product===id),p=ms[0],up=ms.reduce((s,m)=>s+Math.max(0,m.delta),0),down=ms.reduce((s,m)=>s+Math.max(0,-m.delta),0);return `<tr><td>${esc(p.name)}</td><td>${num(up)} ${esc(p.unit)}</td><td>${num(down)} ${esc(p.unit)}</td><td>${num(up-down)} ${esc(p.unit)}</td><td>${money(ms.reduce((s,m)=>s+m.delta*m.price,0))}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Sem dados para o período.</td></tr>'}</tbody></table></div></div>`}return html+`<div class="panel"><div class="panelhead"><h2>${page==='reports'?'Movimentos incluídos no relatório':'Histórico completo de movimentos'}</h2><div class="actions"><button class="btn small" onclick="exportMoves()">↓ Exportar CSV</button>${page==='reports'?'<button class="btn small" onclick="window.print()">Imprimir / PDF</button>':''}</div></div>${movementTable(a)}<div class="tablefoot">${a.length} movimentos · ${filters.from||'Início'} a ${filters.to||'Hoje'} · Custo registado à data do movimento</div></div>`}
function refreshReport(){document.getElementById('reportbody').innerHTML=reportBody()}
function inventoryView(){let a=productsFiltered();return `<div class="notice"><span><b>Conte o material físico e registe as quantidades.</b> Cada diferença gera um ajuste no histórico.</span><button class="btn small" onclick="countDraft={};render()">Limpar contagem</button></div><div class="panel"><div class="panelhead"><h2>Contagem de inventário</h2><button class="btn primary" onclick="reviewCount()">Rever e confirmar contagem</button></div><div class="tools"><div class="search"><input aria-label="Pesquisar inventário" placeholder="Pesquisar produto…" value="${esc(q)}" oninput="q=this.value;updateCount()"></div><select aria-label="Categoria de inventário" onchange="cat=this.value;updateCount()"><option value="">Todas as categorias</option>${[...new Set(db.products.map(p=>p.cat))].map(c=>`<option ${cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><span id="draftcount" style="padding:10px;color:#8c997f">${Object.keys(countDraft).length} contados</span></div><div class="tablewrap"><table><thead><tr><th>Produto</th><th>Localização</th><th>Stock registado</th><th>Quantidade contada</th><th>Diferença</th></tr></thead><tbody id="countrows">${countRows(a)}</tbody></table></div><div class="tablefoot">Deixe em branco os produtos que ainda não contou. A confirmação inclui todos os produtos preenchidos, mesmo fora do filtro.</div></div><div class="panel" style="margin-top:22px"><div class="panelhead"><h2>Inventários confirmados</h2></div>${db.counts.slice().reverse().map(c=>`<div class="row"><span><strong>${c.date} · ${c.count} produtos contados</strong><small>${esc(c.note)}</small></span><span>${c.adjustments} ajustes</span></div>`).join('')||'<div class="empty">Ainda não foi confirmado nenhum inventário.</div>'}</div>`}
function countRows(a){return a.map(p=>`<tr><td><b>${esc(p.name)}</b><small style="display:block;color:#8d9a7e;margin-top:5px">${esc(p.ref)}</small></td><td>${esc(p.loc)}</td><td>${num(p.stock)} ${esc(p.unit)}</td><td><input aria-label="Contagem de ${esc(p.name)}" type="number" min="0" step="0.01" value="${countDraft[p.id]??''}" placeholder="Por contar" style="width:130px;padding:10px;border:1px solid #dce4d2;border-radius:6px" oninput="countDraft[${p.id}]=this.value;if(this.value==='')delete countDraft[${p.id}];document.getElementById('delta${p.id}').textContent=this.value===''?'—':num(Number(this.value)-${p.stock});document.getElementById('draftcount').textContent=Object.keys(countDraft).length+' contados'"></td><td id="delta${p.id}">${countDraft[p.id]===undefined?'—':num(+countDraft[p.id]-p.stock)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sem produtos para estes filtros.</td></tr>'}
function updateCount(){document.getElementById('countrows').innerHTML=countRows(productsFiltered())}
function reviewCount(){let ids=Object.keys(countDraft);if(!ids.length){toast('Preencha pelo menos uma quantidade contada.');return}if(ids.some(id=>!Number.isFinite(+countDraft[id])||+countDraft[id]<0)){toast('As contagens devem ser números iguais ou superiores a zero.');return}let changed=ids.map(id=>db.products.find(p=>p.id==id)).filter(p=>+countDraft[p.id]!==p.stock);modal('Confirmar inventário',`<p>${ids.length} produtos contados · ${changed.length} diferenças a registar.</p>${changed.map(p=>`<div class="row" style="padding:14px 0"><strong>${esc(p.name)}</strong><span>${num(p.stock)} → ${num(countDraft[p.id])} ${esc(p.unit)}</span></div>`).join('')}<form id="countform" style="margin-top:20px">${field('cnote','Observação / responsável *','','text','required maxlength="200"')}</form><div class="hint">As quantidades confirmadas passam a ser o stock atual. Os ajustes ficam identificados no histórico.</div>`,`<button class="btn" onclick="closeModal()">Voltar</button><button class="btn primary" onclick="confirmCount()">Confirmar inventário</button>`)}
function confirmCount(){if(!document.getElementById('countform').reportValidity()||!val('cnote').trim())return;let ids=Object.keys(countDraft),n=0,note=val('cnote').trim();for(let id of ids){let p=db.products.find(p=>p.id==id),delta=+(+countDraft[id]-p.stock).toFixed(2);if(delta){record(p,delta,'Ajuste de inventário',{place:p.loc,document:'INV-'+(db.counts.length+1),note});n++}}db.counts.push({date:today(),count:ids.length,adjustments:n,note});countDraft={};closeModal();save();toast('Inventário confirmado. Stock e histórico atualizados.')}
function csv(filename,rows){let data=rows.map(r=>r.map(v=>{let s=String(v??'');if(/^[=+@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(';')).join('\r\n');download(filename,new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}))}
function download(name,blob){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));document.getElementById('breadcrumb').textContent=names[page];const titles={products:'Stock simples. Controlo completo.',moves:'Tudo o que entra e sai.',inventory:'Conte. Confira. Atualize.',reports:'Os dados que precisa, no período certo.'},subs={products:'Pesquise produtos, acompanhe quantidades e registe movimentos.',moves:'Um histórico pesquisável de todas as alterações de stock.',inventory:'Compare o stock registado com a contagem física dos materiais.',reports:'Escolha os filtros. O relatório é gerado automaticamente.'};document.getElementById('content').innerHTML=`<div class="head"><div><div class="eyebrow">QUICK SKETCHES / GESTÃO DE STOCK</div><h1>${titles[page]}</h1><p>${subs[page]}</p></div><div class="actions"><button class="btn" onclick="productModal()">＋ Novo produto</button><button class="btn primary" onclick="moveModal()">⇄ Registar movimento</button></div></div>${storageFailed?'<div class="notice">O navegador não conseguiu guardar os dados. Exporte uma cópia de segurança.</div>':''}${page==='products'?productView():page==='inventory'?inventoryView():filterToolbar()+'<div id="reportbody">'+reportBody()+'</div>'}`}

async function readAttachments(inputId){const files=[...(document.getElementById(inputId).files||[])];if(files.length>3)throw Error('Selecione no máximo 3 anexos por movimento.');if(files.reduce((s,f)=>s+f.size,0)>1500000)throw Error('Os anexos devem ter no máximo 1,5 MB no total nesta versão local.');return Promise.all(files.map(f=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:f.name,type:f.type,size:f.size,data:r.result});r.onerror=()=>reject(Error('Não foi possível ler o anexo.'));r.readAsDataURL(f)})))}
function attachmentField(id='mattachments'){return `<div class="field"><label for="${id}">Anexos · fotos ou documentos</label><input id="${id}" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt"><small style="color:#89967e">Até 3 ficheiros · 1,5 MB no total · guardados neste navegador</small></div>`}

function downloadAttachment(id,i){let a=db.moves.find(m=>m.id===id)?.attachments[i];if(!a||!/^data:[^,]*;base64,/.test(a.data)){toast('Anexo indisponível.');return}let bytes=Uint8Array.from(atob(a.data.split(',')[1]),c=>c.charCodeAt(0));download(a.name,new Blob([bytes],{type:a.type||'application/octet-stream'}))}
moveModal=function(id){modal('Registar entrada ou saída',`<form id="moveform"><div class="field"><label for="mproduct">Produto</label><select id="mproduct" required>${db.products.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${esc(p.name)} · ${num(p.stock)} ${esc(p.unit)}</option>`).join('')}</select></div><div class="fields"><div class="field"><label for="mtype">Tipo</label><select id="mtype"><option>Entrada</option><option>Saída</option><option>Devolução</option></select></div>${field('mqty','Quantidade *',1,'number','min="0.01" step="0.01" required')}</div>${field('mdate','Data *',today(),'date','required max="'+today()+'"')}<div class="fields">${field('morigin','Origem *','Armazém principal','text','required maxlength="120"')}${field('mdestination','Destino *','','text','required maxlength="120"')}</div>${field('mdoc','Documento / referência','','text','maxlength="80"')}${field('mnote','Observações','','text','maxlength="200"')}${attachmentField()}<p id="error" role="alert" style="color:#b65f47"></p></form>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button id="msave" class="btn primary" onclick="saveMove()">Guardar movimento</button>`)};
saveMove=async function(){if(!document.getElementById('moveform').reportValidity())return;let p=db.products.find(p=>p.id===+val('mproduct')),quantity=+val('mqty'),type=val('mtype'),delta=type==='Saída'?-quantity:quantity;if(!p||!Number.isFinite(quantity)||quantity<=0||p.stock+delta<0){document.getElementById('error').textContent='Quantidade inválida ou superior ao stock disponível.';return}let origin=val('morigin').trim(),destination=val('mdestination').trim();if(!origin||!destination){document.getElementById('error').textContent='Preencha a origem e o destino.';return}let extra={date:val('mdate'),origin,destination,place:origin+' → '+destination,document:val('mdoc').trim(),note:val('mnote').trim(),pending:false};let button=document.getElementById('msave');button.disabled=true;try{extra.attachments=await readAttachments('mattachments');if(p.stock+delta<0)throw Error('O stock disponível mudou. Reveja a quantidade.');record(p,delta,type,extra);closeModal();save();toast('Movimento e anexos guardados. Stock atualizado.')}catch(e){document.getElementById('error').textContent=e.message}finally{button.disabled=false}};
movementTable=function(a){return `<div class="tablewrap"><table><thead><tr><th>Data / hora</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Stock antes → depois</th><th>Origem</th><th>Destino</th><th>Documentação</th><th></th></tr></thead><tbody>${a.map(m=>`<tr><td>${m.date.split('-').reverse().join('/')}<small style="display:block;color:#93a184;margin-top:5px">${m.time}</small></td><td><b>${esc(m.name)}</b><small style="display:block;margin-top:5px;color:#94a080">${esc(m.ref)}</small></td><td><span class="pill ${m.delta<0?'amber':''}">${esc(m.type)}</span>${m.pending?'<small style="display:block;margin-top:6px;color:#b17d2c">Por completar</small>':''}</td><td class="qty">${m.delta>0?'+':''}${num(m.delta)} <span class="unit">${esc(m.unit)}</span></td><td>${num(m.before)} → ${num(m.after)}</td><td>${esc(m.origin)||'—'}</td><td>${esc(m.destination)||'—'}</td><td>${esc(m.document)||'—'}<small style="display:block;color:#8d9b7e;max-width:180px;white-space:normal;margin-top:5px">${esc(m.note)}</small>${m.attachments?.length?`<span class="pill">${m.attachments.length} anexo(s)</span>`:''}</td><td><button class="btn small" onclick="completeMove(${m.id})">${m.pending?'Completar':'Detalhes'}</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">Sem movimentos para estes filtros.</td></tr>'}</tbody></table></div>`};
function completeMove(id){let m=db.moves.find(m=>m.id===id);modal('Documentação do movimento',`<p><b>${esc(m.name)}</b> · ${esc(m.type)} · ${num(m.quantity)} ${esc(m.unit)}</p><p style="font-size:12px;margin-bottom:20px">${m.date} · Stock: ${num(m.before)} → ${num(m.after)}. Completar os dados não altera novamente a quantidade.</p><form id="completeform"><div class="fields">${field('corigin','Origem *',m.origin,'text','required maxlength="120"')}${field('cdestination','Destino *',m.destination,'text','required maxlength="120"')}</div>${field('cdoc','Documento / referência',m.document,'text','maxlength="80"')}${field('cnote','Observações',m.note,'text','maxlength="200"')}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px">${attachmentList(m)}</div>${attachmentField('cattachments')}<p id="cerror" role="alert" style="color:#b65f47"></p></form>`,`<button class="btn" onclick="closeModal()">Fechar</button><button id="csave" class="btn primary" onclick="saveComplete(${id})">Guardar informação</button>`)}
async function saveComplete(id){if(!document.getElementById('completeform').reportValidity())return;let m=db.moves.find(m=>m.id===id),origin=val('corigin').trim(),destination=val('cdestination').trim();if(!origin||!destination){document.getElementById('cerror').textContent='Indique a origem e o destino.';return}let data={origin,destination,place:origin+' → '+destination,document:val('cdoc').trim(),note:val('cnote').trim(),pending:false};let b=document.getElementById('csave');b.disabled=true;try{let added=await readAttachments('cattachments'),attachments=[...(m.attachments||[]),...added];if(attachments.length>3||attachments.reduce((s,a)=>s+a.size,0)>1500000)throw Error('O movimento admite até 3 anexos e 1,5 MB no total.');Object.assign(m,data,{attachments});closeModal();save();toast('Informação completada. A quantidade mantém-se.')}catch(e){document.getElementById('cerror').textContent=e.message}finally{b.disabled=false}}

function operatorValid(){if(!mobileSession.operator.trim()){toast('Indique o nome de quem está a registar.');document.getElementById('operator')?.focus();return false}return true}
function mobileCount(id){if(!operatorValid())return;let p=db.products.find(p=>p.id===id),raw=val('quick-'+id),amount=Number(raw);if(raw===''||!Number.isFinite(amount)||amount<0){toast('Indique uma quantidade igual ou superior a zero.');return}let delta=+(amount-p.stock).toFixed(2);record(p,delta,'Ajuste de inventário',{origin:p.loc||'Armazém principal',destination:p.loc||'Armazém principal',place:p.loc||'Armazém principal',document:'',note:'Contagem rápida · '+mobileSession.operator.trim(),attachments:[],pending:false});mobileSession.done[id]={date:today(),quantity:amount};persistMobile();save();toast('Contagem guardada: '+num(amount)+' '+p.unit)}

function quickMove(id,type){if(!operatorValid())return;let p=db.products.find(p=>p.id===id);modal(type+' rápida',`<p><b>${esc(p.name)}</b><br>Disponível: ${num(p.stock)} ${esc(p.unit)}</p><form id="quickform" style="margin-top:20px">${field('qqty','Quantidade ('+esc(p.unit)+') *',1,'number','min="0.01" step="0.01" inputmode="decimal" required')}${field('qplace',type==='Saída'?'Destino (opcional)':'Origem (opcional)','','text','maxlength="120"')}<div class="hint">Pode guardar já e completar os restantes dados no computador. O registo fica marcado como “Por completar”.</div><p id="qerror" role="alert" style="color:#b65f47"></p></form>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveQuickMove(${id},'${type}')">Guardar ${type.toLowerCase()}</button>`)}

function reportDocument(){let a=filteredMoves();return `<article class="report-document"><div class="report-heading"><div><div class="eyebrow">QUICK SKETCHES</div><h1>Relatório de movimentos de stock</h1><p>${filters.from||'Início do histórico'} a ${filters.to||today()} · ${filters.warehouse?esc(warehouseName(filters.warehouse)):'Todos os armazéns'}</p></div><div><span class="pill">${a.length} movimentos</span><p>Gerado em ${today()}<br>Por ${esc(user().name)}</p></div></div><p class="report-scope">${filters.type?esc(filters.type):'Todos os tipos'} · ${filters.product?esc(db.products.find(p=>p.id==filters.product)?.name):'Todos os produtos'}${filters.origin?' · Origem: '+esc(filters.origin):''}${filters.destination?' · Destino: '+esc(filters.destination):''}${filters.query?' · Pesquisa: '+esc(filters.query):''}${filters.pending?' · Apenas por completar':''}</p><div class="report-summary"><div><small>Entradas valorizadas</small><b>${money(a.reduce((s,m)=>s+Math.max(0,m.delta)*m.price,0))}</b></div><div><small>Saídas valorizadas</small><b>${money(a.reduce((s,m)=>s+Math.max(0,-m.delta)*m.price,0))}</b></div><div><small>Produtos movimentados</small><b>${new Set(a.map(m=>m.product)).size}</b></div></div><h2>Resumo por produto e armazém</h2><table><thead><tr><th>Produto</th><th>Armazém</th><th>Entradas</th><th>Saídas</th><th>Saldo do período</th><th>Variação valorizada</th></tr></thead><tbody>${[...new Set(a.map(m=>m.product+':'+m.warehouse))].map(key=>{let ms=a.filter(m=>m.product+':'+m.warehouse===key),m=ms[0],up=ms.reduce((s,m)=>s+Math.max(0,m.delta),0),down=ms.reduce((s,m)=>s+Math.max(0,-m.delta),0);return `<tr><td><b>${esc(m.name)}</b><small>${esc(m.ref)}</small></td><td>${esc(warehouseName(m.warehouse))}</td><td>${num(up)} ${esc(m.unit)}</td><td>${num(down)} ${esc(m.unit)}</td><td>${num(up-down)} ${esc(m.unit)}</td><td>${money(ms.reduce((s,m)=>s+m.delta*m.price,0))}</td></tr>`}).join('')||'<tr><td colspan="6">Sem movimentos para os filtros escolhidos.</td></tr>'}</tbody></table><h2>Detalhe dos movimentos</h2><table><thead><tr><th>Data</th><th>Produto</th><th>Tipo / quantidade</th><th>Armazém / localização</th><th>Origem → destino</th><th>Documento / responsável</th></tr></thead><tbody>${a.map(m=>`<tr><td>${m.date}</td><td>${esc(m.name)}</td><td>${esc(m.type)}<small>${num(m.delta)} ${esc(m.unit)}</small></td><td>${esc(warehouseName(m.warehouse))}<small>${esc(m.location)}</small></td><td>${esc(m.origin)||'—'} → ${esc(m.destination)||'—'}</td><td>${esc(m.document)||'—'}<small>${esc(m.operator||'Demonstração')} · ${m.pending?'Por completar':'Completo'}</small><small>${esc(m.note)}</small></td></tr>`).join('')}</tbody></table><p class="report-note">Valores calculados pelo custo registado em cada movimento. Inclui ajustes e stock inicial quando selecionados. Quantidades apresentadas por unidade, sem somar unidades diferentes.</p></article>`}
const oldReportBody=reportBody;reportBody=function(){if(page!=='reports')return oldReportBody();if(filters.from&&filters.to&&filters.from>filters.to)return '<div class="notice">Corrija o intervalo de datas.</div>';return `<div class="report-actions"><button class="btn" onclick="downloadReport()">↓ Guardar relatório HTML</button><button class="btn" onclick="window.print()">Imprimir / PDF</button><button class="btn" onclick="exportMoves()">CSV</button></div>`+reportDocument()};
function downloadReport(){if(!requirePermission('reports'))return;let css=document.querySelector('style').textContent;download('relatorio-stock-'+today()+'.html',new Blob(['<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatório de stock</title><style>'+css+'body{padding:35px}table{white-space:normal}.report-document{max-width:1200px;margin:auto}</style>'+reportDocument()+'</html>'],{type:'text/html;charset=utf-8'}))}
function controlView(){return `<div class="head"><div><div class="eyebrow">ADMINISTRAÇÃO</div><h1>Painel de controlo</h1><p>Armazéns, equipa e permissões num só lugar.</p></div></div><div class="panel"><div class="panelhead"><h2>Armazéns e localizações</h2><button class="btn" onclick="warehouseModal()">＋ Armazém</button></div>${db.warehouses.map(w=>`<div class="row"><div><strong>${esc(w.name)}</strong><small>${w.locations.map(esc).join(' · ')}</small></div><button class="btn small" onclick="warehouseModal(${w.id})">Editar</button></div>`).join('')}</div><div class="panel" style="margin-top:24px"><div class="panelhead"><h2>Colaboradores</h2><button class="btn" onclick="userModal()">＋ Colaborador</button></div>${db.users.map(u=>`<div class="row"><div><strong>${esc(u.name)}</strong><small>${esc(u.email)} · ${esc(db.roles.find(r=>r.id===u.role)?.name)} · ${u.active?'Ativo':'Inativo'} · ${Object.keys(u.overrides).length} exceções</small></div><button class="btn small" onclick="userModal(${u.id})">Perfil e permissões</button></div>`).join('')}</div><div class="panel" style="margin-top:24px"><div class="panelhead"><h2>Roles</h2><button class="btn" onclick="roleModal()">＋ Nova role</button></div>${db.roles.map(r=>`<div class="row"><div><strong>${esc(r.name)}</strong><small>${r.id==='admin'?'Acesso total':r.permissions.map(p=>permissionLabels[p]).join(' · ')||'Sem permissões adicionais'}</small></div>${r.id==='admin'?'<span class="pill">Acesso total</span>':`<button class="btn small" onclick="roleModal('${r.id}')">Editar permissões</button>`}</div>`).join('')}</div>`}
function warehouseModal(id){if(!requirePermission('warehouses'))return;let w=db.warehouses.find(w=>w.id===id);modal('Armazém e localizações',`<form id="warehouseform">${field('wname','Nome *',w?.name||'','text','required')}<div class="field"><label>Localizações · uma por linha</label><textarea id="wlocations" rows="8" required>${esc(w?.locations.join('\n')||'')}</textarea></div><p>Localizações com stock ou histórico mantêm-se disponíveis.</p></form>`,`<button class="btn primary" onclick="saveWarehouse(${id||0})">Guardar</button>`)}
function saveWarehouse(id){if(!requirePermission('warehouses')||!document.getElementById('warehouseform').reportValidity())return;let name=val('wname').trim(),locations=[...new Set(val('wlocations').split('\n').map(l=>l.trim()).filter(Boolean))];if(!name||!locations.length){toast('Indique o nome e pelo menos uma localização.');return}let w=db.warehouses.find(w=>w.id===id);if(w){let used=[...db.products.flatMap(p=>p.balances.filter(b=>b.warehouse===id).map(b=>b.location)),...db.moves.filter(m=>m.warehouse===id).map(m=>m.location)].filter(Boolean);w.name=name;w.locations=[...new Set([...locations,...used])]}else db.warehouses.push({id:Math.max(...db.warehouses.map(w=>w.id))+1,name,locations});closeModal();save()}
function roleModal(id){if(!requirePermission('users'))return;let r=db.roles.find(r=>r.id===id);modal('Role e permissões',`<form id="roleform">${field('rname','Nome da role *',r?.name||'','text','required')}<div class="permission-list">${Object.entries(permissionLabels).map(([k,t])=>`<label><input type="checkbox" id="r-${k}" ${r?.permissions.includes(k)?'checked':''}> ${t}</label>`).join('')}</div></form>`,`<button class="btn primary" onclick="saveRole('${id||''}')">Guardar role</button>`)}
function saveRole(id){if(!requirePermission('users')||id==='admin'||!document.getElementById('roleform').reportValidity())return;let name=val('rname').trim();if(!name)return;let permissions=Object.keys(permissionLabels).filter(k=>document.getElementById('r-'+k).checked),r=db.roles.find(r=>r.id===id);if(r)Object.assign(r,{name,permissions});else db.roles.push({id:'role-'+Date.now(),name,permissions});closeModal();save()}
function userModal(id){if(!requirePermission('users'))return;let u=db.users.find(u=>u.id===id);modal('Colaborador e acessos',`<form id="userform">${field('uname','Nome *',u?.name||'','text','required')}${field('uemail','Email *',u?.email||'','email','required')}<div class="field"><label>Role</label><select id="urole">${selectOptions(db.roles.map(r=>[r.id,r.name]),u?.role||'worker')}</select></div><label><input id="uactive" type="checkbox" ${u?.active!==false?'checked':''}> Colaborador ativo</label><h2 style="margin-top:24px">Exceções individuais</h2><p style="font-size:12px;margin:8px 0">“Herdar” segue a role. Pode permitir ou bloquear uma ação apenas para esta pessoa. Administradores têm sempre acesso total.</p>${Object.entries(permissionLabels).map(([k,t])=>`<div class="permission-row"><label>${t}</label><select id="u-${k}">${selectOptions([['inherit','Herdar da role'],['allow','Permitir'],['deny','Bloquear']],u?.overrides[k]===true?'allow':u?.overrides[k]===false?'deny':'inherit')}</select></div>`).join('')}</form>`,`<button class="btn primary" onclick="saveUser(${id||0})">Guardar colaborador</button>`)}
function saveUser(id){if(!requirePermission('users')||!document.getElementById('userform').reportValidity())return;let name=val('uname').trim(),email=val('uemail').trim(),role=val('urole'),active=document.getElementById('uactive').checked;if(!name||db.users.some(u=>u.id!==id&&u.email.toLowerCase()===email.toLowerCase())){toast('Verifique o nome e use um email único.');return}if(!db.users.some(u=>u.id!==id&&u.active&&u.role==='admin')&&(!active||role!=='admin')){toast('É necessário manter pelo menos um administrador ativo.');return}let overrides={};for(let k of Object.keys(permissionLabels)){let v=val('u-'+k);if(v!=='inherit')overrides[k]=v==='allow'}let u=db.users.find(u=>u.id===id),data={name,email,role,active,overrides};if(u)Object.assign(u,data);else db.users.push({id:Math.max(...db.users.map(u=>u.id))+1,...data});if(!user().active)userId=db.users.find(u=>u.active&&u.role==='admin').id;closeModal();save()}
const previousRender=render;render=function(){if(page==='control'){document.body.classList.remove('mobile-mode');document.getElementById('breadcrumb').textContent=names.control;document.getElementById('content').innerHTML=can('users')||can('warehouses')?controlView():'<div class="empty">Sem acesso ao painel de controlo.</div>'}else if(page==='reports'&&!can('reports'))document.getElementById('content').innerHTML='<div class="empty">Sem permissão para consultar relatórios.</div>';else previousRender();document.querySelectorAll('.nav').forEach(n=>{n.classList.toggle('active',n.dataset.page===page);n.hidden=(n.dataset.page==='control'&&!can('users')&&!can('warehouses'))||(n.dataset.page==='reports'&&!can('reports'))});let profile=document.getElementById('profileSwitch');if(!profile){profile=document.createElement('div');profile.id='profileSwitch';document.querySelector('aside .asidefoot').before(profile)}profile.innerHTML=`<label style="display:block;font-size:11px;margin:14px 0 6px;color:#adc3b5">Simular perfil · demonstração</label><select style="width:100%;padding:10px;border-radius:7px" onchange="userId=+this.value;page='products';render()">${selectOptions(db.users.filter(u=>u.active).map(u=>[u.id,u.name+' · '+db.roles.find(r=>r.id===u.role)?.name]),userId)}</select>`};
const controlNav=document.createElement('button');controlNav.className='nav';controlNav.dataset.page='control';controlNav.innerHTML='<span>⚙</span>Painel de controlo';controlNav.onclick=()=>go('control');document.querySelector('aside .asidefoot').before(controlNav);
const baseMobileView=mobileView;mobileView=function(){return warehousePicker('quick',warehouseFilter||1,locationFilter)+baseMobileView()};
const baseMobileCount=mobileCount;mobileCount=function(id){if(!requirePermission('inventory'))return;let p=db.products.find(p=>p.id===id),w=+val('quickwarehouse'),l=val('quicklocation'),raw=val('quick-'+id);if(!operatorValid()||raw===''||!Number.isFinite(+raw)||+raw<0)return;let delta=+(+raw-balance(p,w,l)).toFixed(2);record(p,delta,'Ajuste de inventário',{warehouse:w,location:l,origin:warehouseName(w),destination:warehouseName(w),place:l,note:'Contagem rápida · '+mobileSession.operator,document:'',attachments:[]});mobileSession.done[w+':'+l+':'+id]={quantity:+raw,date:today()};persistMobile();save();toast('Contagem guardada na localização selecionada.')};
const originalQuick=quickMove;let quickWarehouse=1,quickLocation='';quickMove=function(id,type){if(!requirePermission('movements'))return;quickWarehouse=+val('quickwarehouse');quickLocation=val('quicklocation');originalQuick(id,type)};const originalSaveQuick=saveQuickMove;saveQuickMove=function(id,type){if(!requirePermission('movements'))return;let p=db.products.find(p=>p.id===id);if(type==='Saída'&&balance(p,quickWarehouse,quickLocation)<+val('qqty')){document.getElementById('qerror').textContent='Stock insuficiente nesta localização.';return}recordAtLocation(()=>originalSaveQuick(id,type),quickWarehouse,quickLocation)};
const originalProductRows=productRows;productRows=function(){let html=originalProductRows();for(let p of productsFiltered()){let places=p.balances.filter(b=>(!warehouseFilter||b.warehouse==warehouseFilter)&&(!locationFilter||b.location===locationFilter)).map(b=>esc(warehouseName(b.warehouse))+' / '+esc(b.location)+': '+num(b.quantity)+' '+esc(p.unit)).join('<br>');html=html.replace('<td>'+esc(p.loc)+'</td>','<td style="white-space:normal;min-width:180px">'+places+'</td>')}return html};
reviewCount=function(){if(!requirePermission('inventory'))return;if(!warehouseFilter||!locationFilter){toast('Escolha o armazém e a localização da contagem.');return}let ids=Object.keys(countDraft);if(!ids.length||ids.some(id=>!Number.isFinite(+countDraft[id])||+countDraft[id]<0)){toast('Preencha contagens válidas.');return}let changed=ids.map(id=>db.products.find(p=>p.id==id)).filter(p=>+countDraft[p.id]!==balance(p,warehouseFilter,locationFilter));modal('Confirmar contagem por localização',`<p>${esc(warehouseName(warehouseFilter))} / ${esc(locationFilter)} · ${ids.length} produtos contados</p>${changed.map(p=>`<div class="row"><strong>${esc(p.name)}</strong><span>${num(balance(p,warehouseFilter,locationFilter))} → ${num(countDraft[p.id])} ${esc(p.unit)}</span></div>`).join('')}<form id="countform">${field('cnote','Responsável / observação *','','text','required')}</form>`,`<button class="btn" onclick="closeModal()">Voltar</button><button class="btn primary" onclick="confirmCount()">Confirmar contagem</button>`)};
const baseCountRows=countRows;countRows=function(a){return baseCountRows(a).replace(/document.getElementById\('draftcount'\).textContent=Object.keys\(countDraft\).length\+' contados'/g,'')};
const reportExport=exportMoves;exportMoves=function(){if(requirePermission('reports'))reportExport()};const productExport=exportProducts;exportProducts=function(){if(requirePermission('reports'))productExport()};
const finalMobileProducts=mobileProducts;mobileProducts=function(){let w=+val('quickwarehouse')||+warehouseFilter||1,l=val('quicklocation')||db.warehouses.find(a=>a.id===w)?.locations[0];return db.products.filter(p=>(p.name+' '+p.ref+' '+l).toLowerCase().includes(mobileQuery.toLowerCase())&&(!mobileOnlyUncounted||!mobileSession.done[w+':'+l+':'+p.id])).map(p=>({...p,stock:balance(p,w,l),loc:warehouseName(w)+' / '+l}))};
const finalMobileView=mobileView;mobileView=function(){let html=finalMobileView(),w=+warehouseFilter||1,l=locationFilter||db.warehouses.find(a=>a.id===w)?.locations[0],done=db.products.filter(p=>mobileSession.done[w+':'+l+':'+p.id]).length;return html.replace(/\d+ \/ \d+ produtos contados/,done+' / '+db.products.length+' produtos contados').replace('onchange="changeWarehouseLocations(\'quick\')"','onchange="warehouseFilter=this.value;locationFilter=\'\';render()"').replace('id="quicklocation"','id="quicklocation" onchange="locationFilter=this.value;render()"')};
const cardsBefore=mobileCards;mobileCards=function(){let w=+val('quickwarehouse')||+warehouseFilter||1,l=val('quicklocation')||locationFilter||db.warehouses.find(a=>a.id===w)?.locations[0],done=mobileSession.done;let view={};for(let p of db.products)if(done[w+':'+l+':'+p.id])view[p.id]=done[w+':'+l+':'+p.id];mobileSession.done={...done,...view};try{return cardsBefore()}finally{mobileSession.done=done}};

function activeStockFilters(){return [cat,locationFilter,status].filter(Boolean).length}
stockFilters=function(count=false){return `<div class="easy-filters"><div class="field search-field"><label>Pesquisar</label><input aria-label="Pesquisar produtos" value="${esc(q)}" placeholder="Nome ou referência do produto" oninput="q=this.value;${count?'updateCount()':'updateProducts()'}"></div><div class="field"><label>Armazém</label><select onchange="warehouseFilter=this.value;locationFilter='';countDraft={};render()">${selectOptions(db.warehouses.map(w=>[w.id,w.name]),warehouseFilter,count?'Escolher armazém':'Todos os armazéns')}</select></div>${count?`<div class="field"><label>Localização da contagem</label><select onchange="locationFilter=this.value;countDraft={};render()">${selectOptions(db.warehouses.filter(w=>!warehouseFilter||w.id==warehouseFilter).flatMap(w=>w.locations).map(l=>[l,l]),locationFilter,'Escolher localização')}</select></div>`:''}<button class="btn" onclick="stockFilterDialog(${count})">☷ Filtrar${activeStockFilters()?' ('+activeStockFilters()+')':''}</button>${activeStockFilters()?'<button class="btn small" onclick="cat=\'\';status=\'\';locationFilter=\'\';render()">Limpar</button>':''}</div>`}
function stockFilterDialog(count){modal('Filtrar produtos',`<div class="field"><label>Categoria</label><select id="fcat">${selectOptions([...new Set(db.products.map(p=>p.cat))].map(c=>[c,c]),cat,'Todas as categorias')}</select></div>${count?'':`<div class="field"><label>Localização</label><select id="floc">${selectOptions([...new Set(db.warehouses.filter(w=>!warehouseFilter||w.id==warehouseFilter).flatMap(w=>w.locations))].map(l=>[l,l]),locationFilter,'Todas as localizações')}</select></div><div class="field"><label>Stock</label><select id="fstatus">${selectOptions([['low','Baixo · vermelho'],['medium','Atenção · amarelo'],['high','Disponível · verde']],status,'Todos os estados')}</select></div>`}`,`<button class="btn" onclick="cat='';status='';${count?'':'locationFilter=\'\';'}closeModal();render()">Limpar filtros</button><button class="btn primary" onclick="cat=val('fcat');${count?'':"locationFilter=val('floc');status=val('fstatus');"}closeModal();render()">Aplicar filtros</button>`)}
filterToolbar=function(){let n=[filters.type,filters.product,filters.origin,filters.destination,filters.query,filters.pending,filters.warehouse].filter(Boolean).length;return `<div class="panel" style="margin-bottom:20px"><div class="easy-filters"><div class="field"><label>Período</label><select onchange="period(this.value)">${selectOptions([['today','Hoje'],['week','Últimos 7 dias'],['month','Últimos 30 dias'],['previous','Mês anterior'],['all','Todo o histórico'],['custom','Escolher datas']],filters.period)}</select></div>${filters.period==='custom'?`<div class="field"><label>Desde</label><input type="date" value="${filters.from}" onchange="filters.from=this.value;refreshReport()"></div><div class="field"><label>Até</label><input type="date" value="${filters.to}" onchange="filters.to=this.value;refreshReport()"></div>`:''}<button class="btn" onclick="movementFilterDialog()">☷ Filtrar${n?' ('+n+')':''}</button>${n?'<button class="btn small" onclick="filters={period:filters.period,from:filters.from,to:filters.to,type:\'\',product:\'\',place:\'\',query:\'\'};render()">Limpar</button>':''}</div></div>`}

const beforeHistoryProduct=productModal;productModal=function(id){if(id&&!can('products')){productHistory(id);return}beforeHistoryProduct(id);let p=db.products.find(p=>p.id===id);if(p&&can('products'))document.getElementById('productform').insertAdjacentHTML('afterbegin',`<button class="btn" type="button" style="width:100%;margin-bottom:20px" onclick="closeModal();productHistory(${id})">Ver todos os movimentos de stock →</button>`)};
function productHistory(id){let p=db.products.find(p=>p.id===id),a=db.moves.filter(m=>m.product===id).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);modal('Histórico · '+esc(p.name),`<div style="overflow:auto">${movementTable(a)}</div>`,can('products')?`<button class="btn" onclick="closeModal();productModal(${id})">Voltar ao produto</button>`:'');document.getElementById('modal').style.maxWidth='1150px'}
const normalModal=modal;modal=function(t,b,f){document.getElementById('modal').style.maxWidth='';normalModal(t,b,f)};
exportCountHistory=function(){if(!requirePermission('reports'))return;let a=db.countEvents.filter(e=>(e.year||e.date.slice(0,4))===inventoryYear&&(!warehouseFilter||e.warehouse==warehouseFilter)&&(!locationFilter||e.location===locationFilter));csv('inventario-'+inventoryYear+'.csv',[['Ano','Data','Hora','Produto','Armazém','Localização','Anterior','Contado','Diferença','Unidade','Funcionário'],...a.map(e=>[e.year||e.date.slice(0,4),e.date,e.time,e.name,warehouseName(e.warehouse),e.location,e.before,e.quantity,e.delta,e.unit,e.operator])])};render();



db.annualInventories??={};let annualDifference='all';
const annualRegister=registerCount;registerCount=function(...args){if(db.annualInventories[inventoryYear]?.closed){toast('Inventário fechado. O administrador pode reabri-lo.');return false}let ok=annualRegister(...args);if(ok)db.countEvents.at(-1).price=db.products.find(p=>p.id===args[0]).price;return ok};
function annualRows(){let closed=db.annualInventories[inventoryYear];if(closed?.closed)return closed.rows;let events=db.countEvents.filter(e=>(e.year||e.date.slice(0,4))===inventoryYear);return db.products.flatMap(p=>p.balances.map(b=>{let e=events.filter(e=>e.product===p.id&&e.warehouse===b.warehouse&&e.location===b.location).at(-1);return {product:p.id,name:p.name,ref:p.ref,cat:p.cat,unit:p.unit,warehouse:b.warehouse,warehouseLabel:warehouseName(b.warehouse),location:b.location,before:e?.before??b.quantity??balance(p,b.warehouse,b.location),quantity:e?.quantity??null,delta:e?.delta??null,price:e?.price??p.price,operator:e?.operator||'',date:e?.date||'',time:e?.time||'',note:e?.note||''}}))}
function annualFiltered(){return annualRows().filter(r=>(!warehouseFilter||r.warehouse==warehouseFilter)&&(!locationFilter||r.location===locationFilter)&&(!cat||r.cat===cat)&&(!q||(r.name+' '+r.ref).toLowerCase().includes(q.toLowerCase()))&&(annualDifference==='all'||annualDifference==='pending'&&r.quantity===null||annualDifference==='different'&&r.delta!==null&&r.delta!==0||annualDifference==='negative'&&r.delta<0||annualDifference==='positive'&&r.delta>0||annualDifference==='equal'&&r.delta===0))}
function annualTable(rows){return `<div class="tablewrap"><table class="compact-movements"><thead><tr>${['Produto','Armazém / localização','Antes da contagem','Contado','Diferença','Custo / un.','Valor contado','Impacto €','Data / responsável'].map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b><small>${esc(r.ref)}</small></td><td>${esc(r.warehouseLabel)}<small>${esc(r.location)}</small></td><td>${num(r.before)} ${esc(r.unit)}</td><td>${r.quantity===null?'Por contar':num(r.quantity)+' '+esc(r.unit)}</td><td style="color:${r.delta<0?'#ba3028':r.delta>0?'#387a40':'inherit'}"><b>${r.delta===null?'—':(r.delta>0?'+':'')+num(r.delta)}</b></td><td>${money(r.price)}</td><td>${r.quantity===null?'—':money(r.quantity*r.price)}</td><td>${r.delta===null?'—':money(r.delta*r.price)}</td><td>${esc(r.date)} ${esc(r.time)}<small>${esc(r.operator)}</small></td></tr>`).join('')||'<tr><td colspan="9">Sem resultados.</td></tr>'}</tbody></table></div>`}
const annualView=inventoryView;inventoryView=function(){let rows=annualFiltered(),state=db.annualInventories[inventoryYear],pending=annualRows().filter(r=>r.quantity===null).length;return annualView()+`<div class="panel" style="margin-top:22px"><div class="panelhead"><div><h2>Reconciliação anual · ${inventoryYear}</h2><small>${state?.closed?'Fechado em '+esc(state.closedAt)+' por '+esc(state.operator):'Em curso · '+pending+' posições por contar'}</small></div><div class="actions"><button class="btn" onclick="annualExport('csv')">Exportar CSV</button><button class="btn" onclick="annualExport('html')">Relatório HTML / PDF</button>${user().role==='admin'||can('users')?`<button class="btn primary" onclick="annualClose()">${state?.closed?'Reabrir':'Fechar inventário'}</button>`:''}</div></div><div class="easy-filters"><div class="field"><label>Diferenças</label><select onchange="annualDifference=this.value;render()">${selectOptions([['all','Todas'],['different','Com diferenças'],['negative','Faltas'],['positive','Excedentes'],['equal','Sem diferenças'],['pending','Por contar']],annualDifference)}</select></div><span>Valor contado: <b>${money(rows.reduce((s,r)=>s+(r.quantity??0)*r.price,0))}</b> · Impacto: <b>${money(rows.reduce((s,r)=>s+(r.delta??0)*r.price,0))}</b></span></div>${annualTable(rows)}<div style="padding:18px;color:#777;font-size:12px">Última contagem por produto e localização. As diferenças comparam com o stock imediatamente anterior à contagem. Valorização pelo custo unitário registado. O relatório segue os filtros acima.</div></div>`};
function annualExport(format){if(!requirePermission('reports'))return;let rows=annualFiltered();if(format==='csv'){csv('inventario-'+inventoryYear+'.csv',[['Ano','Referência','Produto','Categoria','Armazém','Localização','Unidade','Antes','Contado','Diferença','Custo unitário','Valor contado','Impacto','Data','Hora','Responsável','Observação'],...rows.map(r=>[inventoryYear,r.ref,r.name,r.cat,r.warehouseLabel,r.location,r.unit,r.before,r.quantity,r.delta,r.price,r.quantity===null?'':r.quantity*r.price,r.delta===null?'':r.delta*r.price,r.date,r.time,r.operator,r.note])]);return}let state=db.annualInventories[inventoryYear];let html=`<!doctype html><html lang="pt"><meta charset="utf-8"><title>QUICK · Inventário ${inventoryYear}</title><style>body{font:14px Arial;margin:40px;color:#242424}h1{border-bottom:4px solid #e52319;padding-bottom:16px}table{border-collapse:collapse;width:100%;margin:24px 0}th{background:#242424;color:white;text-align:left}td,th{padding:12px;border-bottom:1px solid #ddd}small{display:block;color:#777;margin-top:6px}tr{break-inside:avoid}button{padding:12px;background:#e52319;color:white;border:0;cursor:pointer}@media print{button{display:none}body{margin:0}thead{display:table-header-group}}</style><h1>QUICK · Inventário anual ${inventoryYear}</h1><p>${state?.closed?'Fechado em '+esc(state.closedAt)+' · '+esc(state.operator):'Provisório · inventário em curso'} · Gerado em ${today()} ${countTime()}</p><p>Filtros: ${esc(warehouseFilter?warehouseName(+warehouseFilter):'Todos os armazéns')} · ${esc(locationFilter||'Todas as localizações')} · ${esc(cat||'Todas as categorias')} · Pesquisa: ${esc(q||'Todas')} · Diferenças: ${esc(annualDifference)}</p><p>Valor contado: <b>${money(rows.reduce((s,r)=>s+(r.quantity??0)*r.price,0))}</b> · Impacto das diferenças: <b>${money(rows.reduce((s,r)=>s+(r.delta??0)*r.price,0))}</b></p>${annualTable(rows)}<p>Valorização pelo custo unitário registado. Quantidades separadas por unidade. Documento de apoio à contabilidade; não é um ficheiro de comunicação à AT.</p><button onclick="window.print()">Imprimir / guardar PDF</button></html>`;download('inventario-'+inventoryYear+'.html',new Blob([html],{type:'text/html;charset=utf-8'}))}
function annualClose(){if(!requirePermission('users'))return;let state=db.annualInventories[inventoryYear];if(state?.closed){modal('Reabrir inventário '+inventoryYear,'<p>A reabertura fica registada com data e responsável.</p>','<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="annualConfirmClose(true)">Reabrir</button>');return}let rows=annualRows(),pending=rows.filter(r=>r.quantity===null).length;if(pending){toast('Faltam contar '+pending+' posições. Use o filtro Por contar.');return}if(inventoryYear!==today().slice(0,4)){toast('Não é possível fechar um ano sem uma campanha registada.');return}modal('Fechar inventário '+inventoryYear,`<p>Será guardada uma versão fixa com ${rows.length} posições, custos, diferenças e responsáveis.</p><p>Data de fecho: ${today()}. ${today().slice(5)!=='12-31'?'Este fecho é provisório para efeitos anuais: não representa automaticamente o stock de 31 de dezembro.':''}</p>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="annualConfirmClose(false)">Fechar e gerar relatório</button>`)}
function annualConfirmClose(reopen){if(!requirePermission('users'))return;let old=db.annualInventories[inventoryYear],audit=old?.audit||[];audit.push({action:reopen?'Reabertura':'Fecho',date:today(),time:countTime(),operator:user().name});db.annualInventories[inventoryYear]=reopen?{...old,closed:false,audit}:{closed:true,closedAt:today()+' '+countTime(),operator:user().name,rows:JSON.parse(JSON.stringify(annualRows())),audit};closeModal();save();if(!reopen){let previous=annualDifference,previousQ=q,previousW=warehouseFilter,previousL=locationFilter,previousC=cat;annualDifference='all';q='';warehouseFilter='';locationFilter='';cat='';annualExport('html');annualDifference=previous;q=previousQ;warehouseFilter=previousW;locationFilter=previousL;cat=previousC}toast(reopen?'Inventário reaberto.':'Inventário fechado e relatório gerado.')}
render();

</script></body></html>
